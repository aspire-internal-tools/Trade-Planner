<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade Planner access</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f1;
        color: #19342d;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 2.5rem;
        border-top: 0.35rem solid #c89b3c;
        background: white;
        box-shadow: 0 0.8rem 2.5rem rgb(25 52 45 / 12%);
      }
      img {
        width: 9rem;
        height: auto;
      }
      h1 {
        margin-top: 2rem;
        font-size: 1.75rem;
      }
      p {
        line-height: 1.6;
      }
      a {
        color: #19342d;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/aspire-logo.png" alt="Aspire Investments and Insurance" />
      <h1>Access has not been assigned</h1>
      <p>You signed in successfully, but this account is not on the Trade Planner staff list.</p>
      <p>If you expected access, ask the person who sent you the link to check your invitation email address.</p>
      <p><a href="/.auth/logout">Sign out</a></p>
    </main>
  </body>
</html>
